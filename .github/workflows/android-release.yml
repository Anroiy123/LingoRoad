name: Android Signed Release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: Version name, for example 1.0.0
        required: true
      version_code:
        description: Monotonic Android version code
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Restore upload keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > src/mobile/android/app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > src/mobile/android/key.properties
      - run: flutter pub get
        working-directory: src/mobile
      - name: Build signed APK and AAB
        working-directory: src/mobile
        env:
          PROD_API_BASE_URL: ${{ vars.PROD_API_BASE_URL }}
        run: |
          test "${PROD_API_BASE_URL#https://}" != "$PROD_API_BASE_URL"
          flutter build apk --release --flavor prod --split-per-abi --build-name '${{ inputs.version_name }}' --build-number '${{ inputs.version_code }}' --dart-define=APP_ENV=prod --dart-define=API_BASE_URL="$PROD_API_BASE_URL"
          flutter build appbundle --release --flavor prod --build-name '${{ inputs.version_name }}' --build-number '${{ inputs.version_code }}' --dart-define=APP_ENV=prod --dart-define=API_BASE_URL="$PROD_API_BASE_URL"
      - uses: actions/upload-artifact@v6
        with:
          name: lingoroad-android-${{ inputs.version_name }}-${{ github.sha }}
          path: |
            src/mobile/build/app/outputs/flutter-apk/*.apk
            src/mobile/build/app/outputs/bundle/prodRelease/*.aab
          if-no-files-found: error
          retention-days: 30
      - name: Remove signing material
        if: always()
        run: rm -f src/mobile/android/app/upload-keystore.jks src/mobile/android/key.properties
