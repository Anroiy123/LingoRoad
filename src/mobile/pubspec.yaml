name: lingoroad_mobile
description: Ứng dụng học tiếng Anh lingoRoad.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  go_router: ^17.3.0
  flutter_secure_storage: ^10.3.1
  audioplayers: ^6.7.1
  provider: ^6.1.2
  shared_preferences: ^2.5.5
  flip_card: ^0.7.0
  flutter_card_swiper: ^7.2.0
  flutter_screenutil: ^5.9.3
  uuid: ^4.6.0
  record: ^6.2.1
  http_parser: ^4.1.2


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
    - assets/images/logo_black.png
    - assets/translations/
  fonts:
    - family: HankenGrotesk
      fonts:
        - asset: assets/fonts/HankenGrotesk-VariableFont_wght.ttf

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/images/logo.png
  adaptive_icon_background: "#1B1C1C"
  adaptive_icon_foreground: assets/images/logo.png
