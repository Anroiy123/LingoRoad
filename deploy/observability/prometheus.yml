global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: [otel-collector:8889]
  - job_name: node
    static_configs:
      - targets: [node-exporter:9100]
  - job_name: postgres
    static_configs:
      - targets: [postgres-exporter:9187]
  - job_name: api-health
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: [http://api:8080/health]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
  - job_name: ml-health
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: [http://ml:8001/ready]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
